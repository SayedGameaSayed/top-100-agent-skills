name: Daily Agent Skills Leaderboard Sync & Live Deployment

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-test:
    name: Auto-Discover & Rank Skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover New Skills, Sync GitHub Stars & Regenerate Leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-and-sync.mjs

      - name: Validate Schema & Rules
        run: node scripts/validate.mjs

      - name: Run Full Test Suite
        run: npm test

      - name: Commit & Push Updated Rankings
        run: |
          # Security check: Ensure skills.json and tools.json were never modified
          if git status --porcelain data/skills.json data/tools.json | grep -q .; then
            echo "::error::Automated sync script attempted to modify protected files (data/skills.json or data/tools.json)!"
            exit 1
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Leaderboard Bot]"
          git add data/leaderboard.json site/data/leaderboard.json data/candidates.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit. Leaderboard is already up-to-date."
          else
            git commit -m "chore(leaderboard): update repository stars and candidates [automated]"
            git push
          fi

  deploy-pages:
    name: Deploy Updated Site to GitHub Pages
    needs: sync-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
