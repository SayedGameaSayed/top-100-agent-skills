name: Validate Skills & Schema

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema & Rules Validation
        run: node scripts/validate.mjs

      - name: Run All Tests
        run: npm test

      - name: Run URL & Path Integrity Audit
        run: node scripts/check-skills-urls.mjs --ci
